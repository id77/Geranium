name: Build TrollStore IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Theos
        run: |
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive https://github.com/theos/theos.git $HOME/theos
          fi
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK 14.5
        run: |
          mkdir -p $HOME/theos/sdks
          if [ ! -d "$HOME/theos/sdks/iPhoneOS14.5.sdk" ]; then
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/theos/sdks-repo
            cd $HOME/theos/sdks-repo
            git sparse-checkout set iPhoneOS14.5.sdk
            mv iPhoneOS14.5.sdk $HOME/theos/sdks/
            cd $HOME
            rm -rf $HOME/theos/sdks-repo
          fi

      - name: Verify iOS SDK 14.5
        run: |
          SDK_PATH="$HOME/theos/sdks/iPhoneOS14.5.sdk"
          if [ ! -d "$SDK_PATH" ]; then
            echo "error: iPhoneOS14.5.sdk not found at $SDK_PATH"
            exit 1
          fi
          if [ ! -d "$SDK_PATH/usr/include" ] || [ ! -d "$SDK_PATH/System/Library/Frameworks" ]; then
            echo "error: iPhoneOS14.5.sdk is incomplete (missing headers or frameworks)"
            exit 1
          fi
          echo "iPhoneOS14.5.sdk installed OK at $SDK_PATH"

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Build IPA
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload TrollStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: Geranium-tipa
          path: build/Geranium.tipa
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/Geranium.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
